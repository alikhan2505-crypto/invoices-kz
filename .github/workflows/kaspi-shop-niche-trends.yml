name: Kaspi Shop niche trends

on:
  schedule:
    # Owns the real 24h cadence itself (see the cron route's own comment
    # for why -- Kaspi blocks Vercel's IPs, so Vercel can only ever
    # dispatch this workflow, never fetch Kaspi directly). Arbitrary
    # off-peak minute, same idea as kaspi-shop-price-check.yml's schedule.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      triggeredBy:
        required: false
        type: string
        default: manual

# One run samples ~18 categories x 3 pages plus a per-SKU sellers pass,
# each with a throttling sleep between Kaspi fetches (see the script) --
# a run can take ~10 minutes. This group name is unique to this workflow, so an overlapping
# scheduled + manual run queues behind whichever is already in progress
# instead of racing it (same reasoning as kaspi-shop-price-check.yml's
# concurrency group).
concurrency:
  group: kaspi-shop-niche-trends
  cancel-in-progress: false

jobs:
  refresh-trends:
    runs-on: ubuntu-latest
    # Search pass (~54 throttled fetches) + sellers pass (~650 throttled
    # offer-view fetches) -- ~10-11 min worst case observed math, 20 for
    # slack.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Refresh niche trends
        env:
          KASPI_SHOP_CRON_SECRET: ${{ secrets.KASPI_SHOP_CRON_SECRET }}
        run: node .github/scripts/kaspi-shop-niche-trends.mjs
