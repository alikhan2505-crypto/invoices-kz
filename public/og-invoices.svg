<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- OG-картинка лендинга Счетов (docs.invoices.kz), 14.10.2026: в палитре
       самого лендинга (тёмно-фиолетовый + бирюза), про Счета, а не про всю
       платформу. PNG собирается: node scripts/build-og-invoices.mjs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1646"/>
      <stop offset="0.55" stop-color="#0E0C24"/>
      <stop offset="1" stop-color="#0A1A22"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.18" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#6D4CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6D4CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.86" cy="0.78" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1A44"/>
      <stop offset="1" stop-color="#151230"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowV)"/>
  <rect width="1200" height="630" fill="url(#glowT)"/>

  <!-- Текст -->
  <text x="72" y="92" font-family="Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="4" fill="#FFFFFF">INVOICES<tspan fill="#8B7BFF">.KZ</tspan></text>
  <text x="72" y="196" font-family="Arial, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF">Счёт за минуту.</text>
  <text x="72" y="266" font-family="Arial, sans-serif" font-weight="800" font-size="56" fill="#5EEAD4">Оплата — через Kaspi</text>
  <text x="72" y="336" font-family="Arial, sans-serif" font-size="25" fill="#C9C5E8">Счета, КП, АВР и накладные — PDF</text>
  <text x="72" y="370" font-family="Arial, sans-serif" font-size="25" fill="#C9C5E8">с подписью и печатью, QR Kaspi в счёте</text>
  <text x="72" y="420" font-family="Arial, sans-serif" font-size="22" fill="#8F8AB8">Шот бір минутта · төлем Kaspi арқылы</text>

  <!-- Плашки -->
  <rect x="72" y="478" width="262" height="52" rx="26" fill="#6D4CFF"/>
  <text x="203" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="21" fill="#FFFFFF">7 дней бесплатно</text>
  <rect x="350" y="478" width="236" height="52" rx="26" fill="none" stroke="#3A3470" stroke-width="2"/>
  <text x="468" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="21" fill="#E7E4FF">Расчёт НДС 16%</text>
  <text x="72" y="590" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#8B7BFF">docs.invoices.kz</text>

  <!-- Карточка счёта -->
  <g transform="translate(40 0) rotate(-4 900 330)" filter="url(#shadow)">
    <rect x="690" y="92" width="420" height="470" rx="28" fill="url(#card)" stroke="#3A3470" stroke-width="2"/>
    <circle cx="726" cy="128" r="7" fill="#E5484D" opacity="0.8"/>
    <circle cx="748" cy="128" r="7" fill="#7C5CFF" opacity="0.8"/>
    <circle cx="770" cy="128" r="7" fill="#2DD4BF" opacity="0.8"/>
    <text x="796" y="135" font-family="Arial, sans-serif" font-size="17" fill="#8F8AB8">invoices.kz/i/2461</text>
    <line x1="690" y1="156" x2="1110" y2="156" stroke="#2C2760" stroke-width="2"/>

    <text x="722" y="196" font-family="Arial, sans-serif" font-size="17" fill="#8F8AB8">Счёт № 2461</text>
    <text x="722" y="228" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">ТОО «Ромашка»</text>
    <rect x="958" y="180" width="124" height="34" rx="17" fill="#123B33"/>
    <text x="1020" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#5EEAD4">Оплачено</text>

    <text x="722" y="280" font-family="Arial, sans-serif" font-size="19" fill="#C9C5E8">Консультационные услуги</text>
    <text x="1078" y="280" text-anchor="end" font-family="Arial, sans-serif" font-size="19" fill="#C9C5E8">150 000 ₸</text>
    <text x="722" y="316" font-family="Arial, sans-serif" font-size="19" fill="#C9C5E8">НДС 16%</text>
    <text x="1078" y="316" text-anchor="end" font-family="Arial, sans-serif" font-size="19" fill="#C9C5E8">24 000 ₸</text>
    <line x1="722" y1="338" x2="1078" y2="338" stroke="#2C2760" stroke-width="2"/>
    <text x="722" y="378" font-family="Arial, sans-serif" font-size="20" fill="#8F8AB8">Итого</text>
    <text x="1078" y="380" text-anchor="end" font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#5EEAD4">174 000 ₸</text>

    <!-- QR Kaspi -->
    <rect x="722" y="410" width="118" height="118" rx="14" fill="#FFFFFF"/>
    <g fill="#14112E">
      <rect x="734" y="422" width="30" height="30" rx="4"/><rect x="740" y="428" width="18" height="18" rx="2" fill="#FFFFFF"/><rect x="745" y="433" width="8" height="8"/>
      <rect x="798" y="422" width="30" height="30" rx="4"/><rect x="804" y="428" width="18" height="18" rx="2" fill="#FFFFFF"/><rect x="809" y="433" width="8" height="8"/>
      <rect x="734" y="486" width="30" height="30" rx="4"/><rect x="740" y="492" width="18" height="18" rx="2" fill="#FFFFFF"/><rect x="745" y="497" width="8" height="8"/>
      <rect x="772" y="424" width="8" height="8"/><rect x="784" y="436" width="8" height="8"/><rect x="772" y="448" width="8" height="8"/>
      <rect x="772" y="462" width="8" height="8"/><rect x="786" y="474" width="8" height="8"/><rect x="800" y="462" width="8" height="8"/>
      <rect x="812" y="474" width="8" height="8"/><rect x="772" y="490" width="8" height="8"/><rect x="788" y="502" width="8" height="8"/>
      <rect x="806" y="490" width="8" height="8"/><rect x="818" y="504" width="8" height="8"/><rect x="742" y="464" width="8" height="8"/>
    </g>
    <rect x="770" y="458" width="22" height="22" rx="5" fill="#F14635"/>
    <text x="862" y="452" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">Оплата Kaspi QR</text>
    <text x="862" y="482" font-family="Arial, sans-serif" font-size="17" fill="#8F8AB8">Kaspi Pay · 174 000 ₸</text>
  </g>

  <!-- Штамп «Оплачено» -->
  <g transform="translate(225 141) scale(0.82) rotate(-10 980 470)">
    <rect x="890" y="430" width="196" height="76" rx="14" fill="none" stroke="#2DD4BF" stroke-width="5"/>
    <text x="988" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="27" letter-spacing="2" fill="#2DD4BF">ОПЛАЧЕНО</text>
    <text x="988" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#2DD4BF">KASPI · 2%</text>
  </g>
</svg>
